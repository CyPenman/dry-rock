<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22262A" />
    <!-- iOS ignores theme-color for an installed app's status bar. black-translucent
         draws the page under it instead (light text on our dark ground) - App.tsx pads
         by env(safe-area-inset-top) so nothing sits behind the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Where in England and Wales is the rock most likely to be dry and climbable, and on which day." />
    <title>Dry Rock</title>
    <!-- Anonymous, cookieless usage counts (src/lib/analytics.ts). count.js skips localhost. -->
    <script data-goatcounter="https://ukdryrock.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
